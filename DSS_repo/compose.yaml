services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: danang_dss
      MYSQL_USER: dss
      MYSQL_PASSWORD: ${DB_PASSWORD:-dss_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports:
      # Máy đã có MySQL khác ở 3306: đặt MYSQL_HOST_PORT=3307 trong .env cạnh file này và DB_PORT=3307 trong apps/api/.env.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_local_password}
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
volumes:
  mysql_data:
  neo4j_data:
