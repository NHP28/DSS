services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: danang_dss
      MYSQL_USER: dss
      MYSQL_PASSWORD: ${DB_PASSWORD:-dss_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
